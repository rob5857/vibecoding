<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor PC AI | Asistente de Troubleshooting</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #0d1b2a;
      --panel-2: #11263a;
      --line: #25445f;
      --text: #edf7ff;
      --muted: #9db5c8;
      --cyan: #2dd4bf;
      --blue: #38bdf8;
      --orange: #fb923c;
      --red: #fb7185;
      --green: #4ade80;
      --shadow: 0 18px 45px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(45,212,191,.10), transparent 30%),
        var(--bg);
    }

    button, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    .sidebar {
      padding: 24px;
      border-right: 1px solid var(--line);
      background: rgba(7,17,31,.82);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #03202d;
      font-size: 26px;
      box-shadow: 0 10px 24px rgba(45,212,191,.20);
    }

    h1 { margin: 0; font-size: 20px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .card {
      background: linear-gradient(180deg, rgba(17,38,58,.96), rgba(13,27,42,.96));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .sidebar h2 { font-size: 14px; margin: 0 0 12px; color: var(--blue); }
    .steps { display: grid; gap: 9px; }
    .step {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border-radius: 10px;
      color: var(--muted);
      border: 1px solid transparent;
    }
    .step span {
      width: 26px; height: 26px; display: grid; place-items: center;
      border-radius: 50%; background: #172f46; color: var(--blue); font-weight: 700;
    }
    .step.active { color: var(--text); background: rgba(56,189,248,.10); border-color: rgba(56,189,248,.28); }
    .step.done span { background: rgba(74,222,128,.16); color: var(--green); }

    .tip { margin-top: 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .tip strong { color: var(--orange); }

    .main {
      min-width: 0;
      padding: 24px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      height: 100vh;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .status { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .dot { width: 10px; height: 10px; background: var(--green); border-radius: 50%; box-shadow: 0 0 14px var(--green); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px 14px;
      color: var(--text);
      background: #14283c;
      transition: .18s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--blue); }
    .btn.primary { color: #03202d; border: 0; font-weight: 800; background: linear-gradient(135deg, var(--blue), var(--cyan)); }
    .btn.report { border-color: rgba(251,146,60,.45); color: #ffd5b6; }

    .chat {
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      scroll-behavior: smooth;
    }

    .message { display: flex; gap: 11px; margin-bottom: 16px; max-width: 850px; animation: pop .18s ease-out; }
    .message.user { margin-left: auto; flex-direction: row-reverse; }
    .avatar {
      flex: 0 0 38px; height: 38px; display: grid; place-items: center;
      border-radius: 12px; background: #18334c; border: 1px solid var(--line);
    }
    .message.user .avatar { background: rgba(45,212,191,.15); }
    .bubble {
      padding: 13px 15px;
      border-radius: 7px 18px 18px 18px;
      line-height: 1.55;
      background: #132a3f;
      border: 1px solid var(--line);
      white-space: pre-line;
    }
    .message.user .bubble {
      border-radius: 18px 7px 18px 18px;
      background: linear-gradient(135deg, #075985, #0f766e);
      border-color: transparent;
    }
    .meta { color: var(--muted); font-size: 11px; margin-top: 6px; }

    .composer { padding: 14px; }
    .input-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    textarea {
      width: 100%; min-height: 64px; max-height: 160px; resize: vertical;
      border-radius: 13px; border: 1px solid var(--line); outline: none;
      padding: 14px; color: var(--text); background: #081522;
    }
    textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(56,189,248,.10); }
    .hint { margin-top: 8px; font-size: 12px; color: var(--muted); }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .chip { padding: 7px 10px; border-radius: 999px; font-size: 12px; background: #132a3f; color: #c6e8fa; border: 1px solid var(--line); cursor: pointer; }

    @keyframes pop { from { opacity: 0; transform: translateY(5px); } }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .main { padding: 12px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .input-row { grid-template-columns: 1fr; }
      .input-row .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">🩺</div>
        <div><h1>Doctor PC AI</h1><div class="subtitle">Diagnóstico educativo guiado</div></div>
      </div>

      <section class="card">
        <h2>Proceso de troubleshooting</h2>
        <div class="steps" id="steps"></div>
      </section>

      <div class="tip card">
        <strong>Regla del taller:</strong><br>
        No reemplazamos componentes por adivinanza. Primero preguntamos, observamos, probamos y documentamos.
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="status"><span class="dot"></span> Simulador educativo basado en reglas</div>
        <div class="actions">
          <button class="btn" id="newBtn">↻ Nueva reparación</button>
          <button class="btn report" id="reportBtn">📄 Generar reporte</button>
        </div>
      </header>

      <section class="chat card" id="chat" aria-live="polite"></section>

      <section class="composer card">
        <div class="input-row">
          <textarea id="problemInput" placeholder="Describe el problema o contesta la pregunta del técnico... Ej.: Mi computadora prende, pero no da vídeo."></textarea>
          <button class="btn primary" id="analyzeBtn">🔎 Analizar</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="hint">Presiona Enter para enviar. Usa Shift + Enter para una línea nueva.</div>
      </section>
    </main>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('problemInput');
const chips = document.getElementById('chips');

const stepNames = [
  'Identificar síntoma', 'Hacer preguntas', 'Recopilar evidencias',
  'Organizar causas', 'Recomendar pruebas', 'Registrar resultados', 'Generar reporte'
];

let caseData;
let currentFlow = [];
let questionIndex = 0;
let stage = 0;

const flows = {
  video: {
    label: 'enciende, pero no muestra vídeo',
    questions: [
      '¿El monitor enciende y muestra algún mensaje, como “No Signal” o “Sin señal”?',
      '¿Confirmaste que el cable HDMI, DisplayPort, DVI o VGA está bien conectado en ambos extremos?',
      'Si la computadora tiene tarjeta gráfica dedicada, ¿el cable está conectado a la tarjeta y no al puerto del motherboard?',
      '¿Escuchas códigos de pitidos o ves luces de diagnóstico en el motherboard?',
      '¿Los ventiladores giran y el teclado enciende sus luces?',
      '¿Probaste otro cable, otro puerto o un monitor que sepas que funciona?',
      'Con la computadora apagada y desconectada, ¿verificaste que la memoria RAM esté bien instalada?'
    ],
    causes: ['Conexión o entrada incorrecta del monitor', 'Cable o monitor defectuoso', 'RAM mal instalada o con mal contacto', 'Tarjeta gráfica sin alimentación o mal conectada', 'Fallo de POST, fuente o motherboard'],
    tests: ['Seleccionar manualmente la entrada correcta del monitor.', 'Probar con un cable y monitor conocidos como funcionales.', 'Reinstalar un solo módulo RAM y probar cada ranura, con el equipo desconectado.', 'Verificar los conectores PCIe de la tarjeta gráfica.', 'Consultar LEDs Q-LED/EZ Debug o códigos de pitidos del fabricante.']
  },
  power: {
    label: 'no enciende',
    questions: [
      '¿Hay alguna luz encendida en el gabinete, motherboard o fuente de poder?',
      '¿El cable de corriente y el interruptor trasero de la fuente están correctamente colocados?',
      '¿Probaste otro tomacorriente o eliminaste temporalmente la regleta/UPS?',
      '¿El conector ATX de 24 pines y el conector CPU de 4/8 pines están firmes?',
      'Al presionar el botón, ¿ocurre algo por un instante: ventilador, luz, sonido o clic?',
      '¿Hubo olor a quemado, líquido, golpe o cambio de componente antes del fallo?'
    ],
    causes: ['Falta de corriente externa', 'Cable o interruptor de la fuente', 'Conexión ATX/CPU suelta', 'Botón frontal o cable PWR SW', 'Fuente de poder o motherboard'],
    tests: ['Probar un tomacorriente conocido.', 'Revisar interruptor y cable de alimentación.', 'Reinstalar conexiones ATX y CPU.', 'Verificar la posición del PWR SW en el manual.', 'Probar con una fuente conocida y compatible siguiendo normas del taller.']
  },
  internet: {
    label: 'tiene un problema de conexión a Internet',
    questions: [
      '¿La conexión es por Wi-Fi o por cable Ethernet?',
      '¿El problema ocurre solamente en esta computadora o también en otros equipos?',
      '¿La computadora muestra “Conectado sin Internet”, “Red no identificada” u otro mensaje?',
      '¿Las luces del puerto Ethernet o del router están encendidas?',
      '¿La computadora recibe una dirección IP o aparece una dirección 169.254.x.x?',
      '¿Reiniciaste el adaptador de red y probaste otra red, cable o puerto?'
    ],
    causes: ['Wi-Fi desactivado o señal débil', 'Cable o puerto Ethernet', 'Configuración DHCP/IP', 'Adaptador o controlador de red', 'Router, módem o proveedor'],
    tests: ['Comparar con otro dispositivo en la misma red.', 'Probar otro cable o puerto.', 'Ejecutar ipconfig y revisar IP, puerta de enlace y DNS.', 'Deshabilitar y habilitar el adaptador.', 'Probar ping a la puerta de enlace antes de atribuir el fallo a Internet.']
  },
  slow: {
    label: 'funciona lentamente',
    questions: [
      '¿La lentitud ocurre al encender, abrir programas, navegar o en todo momento?',
      '¿Desde cuándo ocurre y qué cambio se realizó antes de comenzar?',
      '¿Qué porcentaje muestran CPU, memoria y disco en el Administrador de tareas?',
      '¿Cuánto espacio libre queda en la unidad principal?',
      '¿El equipo usa HDD o SSD y produce sonidos inusuales?',
      '¿Se han realizado análisis de malware y revisado los programas de inicio?'
    ],
    causes: ['Demasiados programas de inicio', 'RAM insuficiente', 'Disco lleno, lento o degradado', 'Proceso consumiendo recursos', 'Malware, temperatura o actualizaciones'],
    tests: ['Revisar Procesos e Inicio en el Administrador de tareas.', 'Registrar uso de CPU, RAM y disco.', 'Verificar espacio libre y estado SMART.', 'Ejecutar análisis de seguridad autorizado.', 'Medir temperaturas y revisar ventilación.']
  },
  generic: {
    label: 'presenta un problema que requiere diagnóstico',
    questions: [
      '¿Qué hace exactamente el equipo y qué esperabas que hiciera?',
      '¿Cuándo comenzó el problema y ocurre siempre o de forma intermitente?',
      '¿Qué mensaje de error, luz, sonido o comportamiento observas?',
      '¿Qué cambió antes del problema: software, hardware, actualización, golpe o apagón?',
      '¿Qué pruebas ya realizaste y cuáles fueron sus resultados?',
      '¿El problema también ocurre con otro usuario, cable, periférico o programa?'
    ],
    causes: ['Configuración o conexión', 'Software o controlador', 'Periférico', 'Alimentación o temperatura', 'Componente interno'],
    tests: ['Reproducir el síntoma de forma controlada.', 'Cambiar una sola variable a la vez.', 'Usar un componente o cable conocido como funcional.', 'Registrar mensajes y códigos exactos.', 'Consultar documentación del fabricante antes de reemplazar piezas.']
  }
};

function detectFlow(text) {
  const t = text.toLowerCase();
  if (/(no da video|no da vídeo|sin video|sin vídeo|pantalla negra|no signal|sin señal)/.test(t)) return 'video';
  if (/(no prende|no enciende|no arranca|muerta|no hace nada)/.test(t)) return 'power';
  if (/(internet|wifi|wi-fi|ethernet|red|conexión|conexion)/.test(t)) return 'internet';
  if (/(lenta|lento|se congela|se friza|tarda|100%)/.test(t)) return 'slow';
  return 'generic';
}

function timeNow() { return new Date().toLocaleTimeString('es-PR', {hour:'2-digit', minute:'2-digit'}); }

function addMessage(text, who='bot') {
  const row = document.createElement('div');
  row.className = `message ${who === 'user' ? 'user' : ''}`;
  row.innerHTML = `<div class="avatar">${who === 'user' ? '👤' : '🩺'}</div><div><div class="bubble"></div><div class="meta">${who === 'user' ? 'Estudiante' : 'Doctor PC AI'} · ${timeNow()}</div></div>`;
  row.querySelector('.bubble').textContent = text;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function setStage(n) {
  stage = Math.max(stage, n);
  document.getElementById('steps').innerHTML = stepNames.map((name, i) =>
    `<div class="step ${i === stage ? 'active' : ''} ${i < stage ? 'done' : ''}"><span>${i < stage ? '✓' : i+1}</span>${name}</div>`
  ).join('');
}

function setChips(options=[]) {
  chips.innerHTML = '';
  options.forEach(option => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = option;
    b.onclick = () => { input.value = option; analyze(); };
    chips.appendChild(b);
  });
}

function newCase() {
  caseData = { started: new Date(), symptom: '', category: '', evidence: [], causes: [], tests: [], results: [] };
  currentFlow = [];
  questionIndex = 0;
  stage = 0;
  chat.innerHTML = '';
  setStage(0);
  addMessage('¡Bienvenido al taller de diagnóstico! Describe el problema con tus propias palabras. No intentaré adivinar el componente averiado: primero seguiremos un proceso de preguntas, evidencias y pruebas.');
  setChips(['Prende, pero no da vídeo', 'No enciende', 'No conecta a Internet', 'Está muy lenta']);
  input.value = '';
  input.focus();
}

function analyze() {
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  addMessage(text, 'user');
  input.value = '';

  if (!caseData.symptom) {
    const key = detectFlow(text);
    const flow = flows[key];
    caseData.symptom = text;
    caseData.category = key;
    caseData.causes = flow.causes;
    caseData.tests = flow.tests;
    currentFlow = flow.questions;
    setStage(1);
    addMessage(`Síntoma registrado: el equipo ${flow.label}.\n\nAntes de señalar una pieza, necesito recopilar evidencia. Pregunta 1 de ${currentFlow.length}:\n${currentFlow[0]}`);
    setChips(['Sí', 'No', 'No estoy seguro', 'No lo he probado']);
    return;
  }

  if (questionIndex < currentFlow.length) {
    caseData.evidence.push({ question: currentFlow[questionIndex], answer: text });
    questionIndex++;
    setStage(questionIndex < currentFlow.length ? 2 : 3);
    if (questionIndex < currentFlow.length) {
      addMessage(`Evidencia registrada. Pregunta ${questionIndex + 1} de ${currentFlow.length}:\n${currentFlow[questionIndex]}`);
      setChips(['Sí', 'No', 'No estoy seguro', 'No lo he probado']);
    } else {
      addMessage(`Ya tenemos evidencia inicial. Estas son categorías de causas posibles, todavía no un diagnóstico final:\n\n• ${caseData.causes.join('\n• ')}\n\nPruebas recomendadas, de menor riesgo y costo hacia mayor intervención:\n\n1. ${caseData.tests.join('\n2. ')}\n\nRealiza una prueba a la vez y escribe el resultado de la primera.`);
      setStage(4);
      setChips(['Funcionó', 'No funcionó', 'Resultado parcial', 'No puedo realizarla']);
    }
    return;
  }

  caseData.results.push(text);
  setStage(5);
  addMessage(`Resultado registrado: “${text}”.\n\nBuena práctica: no cambies varias cosas a la vez. Continúa con la próxima prueba aplicable y registra qué observaste. Cuando termines, usa “Generar reporte”.`);
  setChips(['Funcionó', 'No funcionó', 'Resultado parcial', 'Finalizar diagnóstico']);
}

function generateReport() {
  if (!caseData.symptom) {
    addMessage('Primero describe el problema y completa algunas preguntas de diagnóstico para poder generar un reporte útil.');
    return;
  }
  setStage(6);
  const evidence = caseData.evidence.length
    ? caseData.evidence.map((e,i) => `${i+1}. ${e.question}\n   Respuesta: ${e.answer}`).join('\n')
    : 'No se registraron respuestas.';
  const results = caseData.results.length
    ? caseData.results.map((r,i) => `${i+1}. ${r}`).join('\n')
    : 'Pendientes de registrar.';
  const report = `REPORTE DE TROUBLESHOOTING - DOCTOR PC AI\n\nFecha: ${new Date().toLocaleString('es-PR')}\nSíntoma informado: ${caseData.symptom}\n\nEVIDENCIAS\n${evidence}\n\nPOSIBLES CAUSAS (no confirmadas)\n• ${caseData.causes.join('\n• ')}\n\nPRUEBAS RECOMENDADAS\n1. ${caseData.tests.join('\n2. ')}\n\nRESULTADOS REGISTRADOS\n${results}\n\nCONCLUSIÓN\nEl componente averiado no debe declararse hasta que una prueba controlada confirme o descarte cada hipótesis.`;

  const blob = new Blob([report], {type: 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Reporte_Doctor_PC_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  addMessage('Reporte generado y descargado. Incluye el síntoma, las evidencias, las causas posibles, las pruebas y los resultados registrados.');
}

document.getElementById('analyzeBtn').addEventListener('click', analyze);
document.getElementById('newBtn').addEventListener('click', newCase);
document.getElementById('reportBtn').addEventListener('click', generateReport);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); analyze(); }
});

newCase();
</script>
</body>
</html>
